name: privis-track

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-privis_track}
      POSTGRES_USER: ${POSTGRES_USER:-privis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-privis_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # Image hardened dari Chainguard (distroless, non-root UID 65532), dipin
    # dengan digest agar reproducible. Override lewat MINIO_IMAGE di .env bila
    # memakai registry/mirror MinIO lain.
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio@sha256:cee9a8e35885e93f14b3cb32960e5017aff74e2adfb52ba87c65003b0163886b}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-privis_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-privis_minio_password}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # Membuat bucket privat sekali jalan; sekaligus menjadi readiness gate untuk API
  # (image MinIO distroless tidak menyediakan shell/curl/mc untuk healthcheck).
  minio-init:
    image: amazon/aws-cli:2.39.4
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-privis_admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-privis_minio_password}
      AWS_DEFAULT_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET: ${MINIO_BUCKET:-privis-documents}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-privis_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-privis_minio_password}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1; do
          echo "menunggu minio...";
          sleep 2;
        done
        if ! aws --endpoint-url http://minio:9000 s3api head-bucket --bucket "$$MINIO_BUCKET" >/dev/null 2>&1; then
          aws --endpoint-url http://minio:9000 s3 mb "s3://$$MINIO_BUCKET"
        fi
        mkdir -p /mc
        jq -n --arg url "http://minio:9000" \
          --arg ak "$$MINIO_ROOT_USER" --arg sk "$$MINIO_ROOT_PASSWORD" \
          '{version:"10",aliases:{local:{url:$$url,accessKey:$$ak,secretKey:$$sk,api:"S3v4",path:"auto"}}}' \
          > /mc/config.json
        chmod 777 /mc
        chmod 644 /mc/config.json
        echo "minio siap: bucket $$MINIO_BUCKET (private), akun layanan disiapkan"
    volumes:
      - mc_config:/mc
    depends_on:
      - minio

  # Akun layanan MinIO (least privilege). Root hanya dipakai container init;
  # proses API memakai MINIO_ACCESS_KEY/MINIO_SECRET_KEY.
  #
  # mc dijalankan satu perintah per container karena image Chainguard distroless
  # tidak punya shell. Konfigurasi alias dibagi lewat volume `mc_config`.
  minio-policy:
    image: ${MINIO_CLIENT_IMAGE:-cgr.dev/chainguard/minio-client:latest}
    restart: "no"
    environment:
      MC_CONFIG_DIR: /mc
    command:
      - admin
      - policy
      - create
      - local
      - privis-api
      - /config/minio-policy.json
    volumes:
      - mc_config:/mc
      - ./deploy/minio-policy.json:/config/minio-policy.json:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully

  minio-user:
    image: ${MINIO_CLIENT_IMAGE:-cgr.dev/chainguard/minio-client:latest}
    restart: "no"
    environment:
      MC_CONFIG_DIR: /mc
    command:
      - admin
      - user
      - add
      - local
      - ${MINIO_API_USER:-privis_api}
      - ${MINIO_API_PASSWORD:-privis_api_password}
    volumes:
      - mc_config:/mc
    depends_on:
      minio-init:
        condition: service_completed_successfully

  minio-user-policy:
    image: ${MINIO_CLIENT_IMAGE:-cgr.dev/chainguard/minio-client:latest}
    restart: "no"
    environment:
      MC_CONFIG_DIR: /mc
    command:
      - admin
      - policy
      - attach
      - local
      - privis-api
      - --user
      - ${MINIO_API_USER:-privis_api}
    volumes:
      - mc_config:/mc
    depends_on:
      minio-policy:
        condition: service_completed_successfully
      minio-user:
        condition: service_completed_successfully

  api:
    build:
      context: .
      target: runtime
    container_name: privis-track-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-privis}:${POSTGRES_PASSWORD:-privis_dev_password}@postgres:5432/${POSTGRES_DB:-privis_track}?schema=public
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_API_USER:-privis_api}
      MINIO_SECRET_KEY: ${MINIO_API_PASSWORD:-privis_api_password}
      APP_BASE_URL: ${APP_BASE_URL:-https://privis.briczz.my.id}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    # Hanya localhost untuk debugging. Akses publik lewat NPM/Cloudflare Tunnel.
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - default
      - proxy-net
    depends_on:
      postgres:
        condition: service_healthy
      minio-user-policy:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Jalankan manual setelah review skema:
  #   docker compose --profile tools run --rm migrate
  migrate:
    profiles: ["tools"]
    build:
      context: .
      target: build
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-privis}:${POSTGRES_PASSWORD:-privis_dev_password}@postgres:5432/${POSTGRES_DB:-privis_track}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  # Mirror bucket MinIO ke folder lokal saat scripts/backup.sh berjalan.
  # Dipanggil manual oleh script dengan BACKUP_MIRROR_DIR=<folder tujuan>.
  backup-mirror:
    profiles: ["tools"]
    image: ${MINIO_CLIENT_IMAGE:-cgr.dev/chainguard/minio-client:latest}
    restart: "no"
    user: "0:0"
    environment:
      MC_CONFIG_DIR: /mc
    command:
      - mirror
      - --overwrite
      - local/${MINIO_BUCKET:-privis-documents}
      - /backup
    volumes:
      - mc_config:/mc
      - ${BACKUP_MIRROR_DIR:-./backups/work}:/backup

  # Seed data contoh (user, klien, proyek, dokumen, aktivitas).
  #   docker compose --profile tools run --rm seed
  seed:
    profiles: ["tools"]
    build:
      context: .
      target: build
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-privis}:${POSTGRES_PASSWORD:-privis_dev_password}@postgres:5432/${POSTGRES_DB:-privis_track}?schema=public
      SEED_ALLOW_PRODUCTION: "true"
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Privis123!}
    command: ["npx", "prisma", "db", "seed"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  mc_config:

networks:
  default:
  # Dibuat oleh stack server-infra (Nginx Proxy Manager) di VPS:
  #   docker network create proxy-net
  proxy-net:
    external: true
    name: proxy-net
